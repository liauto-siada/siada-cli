<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Siada · 悬浮球体验</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #263443; background: #fafbf9; font: 15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  header { height: 76px; padding: 0 6vw; display: flex; align-items: center; border-bottom: 1px solid #e5eae5; background: #fff; font-size: 21px; font-weight: 650; gap: 12px; }
  header img { width: 32px; height: 32px; }
  main { max-width: 860px; margin: auto; padding: 70px 32px; }
  .eyebrow { color: #668a7a; font-size: 12px; letter-spacing: 2px; }
  h1 { font-size: clamp(30px,4vw,44px); line-height: 1.25; letter-spacing: -1px; font-weight: 600; }
  p { color: #778178; }
  article { margin-top: 42px; background: white; border: 1px solid #e6ebe6; border-radius: 18px; padding: 32px; }
  h2 { font-size: 23px; font-weight: 550; }
  .panel { position: fixed; right: 0; top: 0; width: min(380px,100vw); height: 100dvh; z-index: 2147483647; background: white; border-left: 1px solid #e2e9ef; box-shadow: -10px 0 40px #24394e0a; padding: 22px; }
  .panel header { padding: 0; height: 50px; font-size: 17px; gap: 10px; }
  .panel header span { flex: 1; }
  button { font: inherit; cursor: pointer; border: 0; background: transparent; color: #718594; }
  [hidden] { display: none !important; }
</style>
<header><img src="../packages/chrome-extension/icons/icon48.png" alt="">Siada</header>
<main>
  <div class="eyebrow">BROWSER COMPANION</div>
  <h1>一键打开 Siada。</h1>
  <p>右侧悬浮球默认隐藏一半，悬停完整显示。点击图标打开侧边栏。</p>
  <article>
    <h2>继续浏览，需要时再打开助手</h2>
    <p>悬浮球只负责打开 Siada sidepanel，使用扩展已有的 Siada 图标。</p>
    <p>你可以直接点击半露的图标，也可以把鼠标移上去，再点击完整显示的图标。</p>
    <p>此页使用扩展相同的悬浮球代码，侧栏是预览占位。正式扩展中点击会打开 Chrome 原生 sidepanel。</p>
  </article>
</main>
<section class="panel" aria-label="Siada sidepanel 预览" hidden>
  <header><img src="../packages/chrome-extension/icons/icon48.png" alt=""><span>Siada</span><button aria-label="关闭侧边栏">×</button></header>
  <h2>Sidepanel 已打开</h2>
  <p>这是侧边栏打开效果的预览。</p>
</section>
<script>
  const panel = document.querySelector(".panel");
  window.chrome = {
    runtime: {
      getURL: path => "../packages/chrome-extension/" + path,
      sendMessage: async () => {
        panel.hidden = false;
        panel.querySelector("button").focus();
        return {ok:true};
      },
    },
  };
  function closePanel() {
    panel.hidden = true;
    document.getElementById("siada-floating-launcher").shadowRoot.querySelector("button").focus();
  }
  panel.querySelector("button").addEventListener("click",closePanel);
  document.addEventListener("keydown",event => {
    if (event.key === "Escape" && !panel.hidden) closePanel();
  });
</script>
<script src="../packages/chrome-extension/dist/floating/content-script.js"></script>
</html>
