[tool:pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: marks tests as integration tests (requiring real API calls)
    slow: marks tests as slow running tests
addopts = 
    --tb=short
    --color=yes
    --strict-warnings
