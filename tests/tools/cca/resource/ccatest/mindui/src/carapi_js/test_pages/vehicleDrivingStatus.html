<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车辆驾驶状态接口</title>
    <link rel="stylesheet" href="common-test-page.css">
    <style>
        .api-table {
            border-collapse: separate;
            border-spacing: 0 8px;
            width: 100%;
        }
        
        .api-table td {
            padding: 8px 16px;
            vertical-align: middle;
        }
        
        .api-table .result-span {
            margin-left: 8px;
        }
        
        .api-table button {
            margin-right: 8px;
        }
        
        .api-table span.label {
            margin-right: 8px;
            color: #555;
        }
    </style>
</head>

<body>
    <h1>车辆驾驶状态接口</h1>
    <table class="api-table">
        <tr>
            <td>
                <button id="DriveMode">获取能源模式</button><span class="result-span" id="DriveMode_result"></span>
            </td>
            <td>
                <span class="label">能源模式</span>
                <button id="set_CarSettingsTpuPlugin_EnergyMode_0">纯电优先</button>
                <button id="set_CarSettingsTpuPlugin_EnergyMode_1">燃油优先</button>
                <button id="set_CarSettingsTpuPlugin_EnergyMode_2">油电混合</button>
                <span class="result-span" id="set_CarSettingsTpuPlugin_EnergyMode_result"></span>
            </td>
        </tr>
        <tr>
            <td>
                <button id="DrivingMode">获取动力模式</button><span class="result-span" id="DrivingMode_result"></span>
            </td>
            <td>
                <span class="label">动力模式</span>
                <button id="set_CarSettingsTpuPlugin_DrivingMode_0">舒适</button>
                <button id="set_CarSettingsTpuPlugin_DrivingMode_1">标准</button>
                <button id="set_CarSettingsTpuPlugin_DrivingMode_2">运动</button>
                <button id="set_CarSettingsTpuPlugin_DrivingMode_3">高性能</button>
                <button id="set_CarSettingsTpuPlugin_DrivingMode_4">节能</button>
                <button id="set_CarSettingsTpuPlugin_DrivingMode_5">后排舒适</button>
                <span class="result-span" id="set_CarSettingsTpuPlugin_DrivingMode_result"></span>
            </td>
        </tr>
        <tr>
            <td>
                <button id="AirSuspension">获取魔毯悬架</button><span class="result-span" id="AirSuspension_result"></span>
            </td>
            <td>
                <span class="label">魔毯悬架</span>
                <button id="set_CarSettingsTpuPlugin_MagicSuspensionMode_0">舒适魔毯</button>
                <button id="set_CarSettingsTpuPlugin_MagicSuspensionMode_1">运动魔毯</button>
                <span class="result-span" id="set_CarSettingsTpuPlugin_MagicSuspensionMode_result"></span>
            </td>
        </tr>
        <tr>
            <td>
                <button id="SpringSuspension">获取CDC悬架</button><span class="result-span" id="SpringSuspension_result"></span>
            </td>
            <td>
                <span class="label">CDC悬架</span>
                <button id="set_CarSettingsTpuPlugin_CdcSuspensionMode_0">舒适CDC</button>
                <button id="set_CarSettingsTpuPlugin_CdcSuspensionMode_1">运动CDC</button>
                <span class="result-span" id="set_CarSettingsTpuPlugin_CdcSuspensionMode_result"></span>
            </td>
        </tr>
        <tr>
            <td>
                <button id="SuspensionAdjustment">获取悬架舒适度</button><span class="result-span" id="SuspensionAdjustment_result"></span>
            </td>
            <td>
                <span class="label">悬架舒适度</span>
                <button id="set_CarSettingsTpuPlugin_SuspensionComfortLevel_0">舒适</button>
                <button id="set_CarSettingsTpuPlugin_SuspensionComfortLevel_1">标准</button>
                <button id="set_CarSettingsTpuPlugin_SuspensionComfortLevel_2">运动</button>
                <span class="result-span" id="set_CarSettingsTpuPlugin_SuspensionComfortLevel_result"></span>
            </td>
        </tr>
        <tr>
            <td>
                <button id="SuspensionHeight">获取悬架高度</button><span class="result-span" id="SuspensionHeight_result"></span>
            </td>
            <td>
                <span class="label">悬架高度</span>
                <button id="set_CarSettingsTpuPlugin_SuspensionHeight_0">低</button>
                <button id="set_CarSettingsTpuPlugin_SuspensionHeight_1">标准</button>
                <button id="set_CarSettingsTpuPlugin_SuspensionHeight_2">高</button>
                <button id="set_CarSettingsTpuPlugin_SuspensionHeight_3">较高</button>
                <span class="result-span" id="set_CarSettingsTpuPlugin_SuspensionHeight_result"></span>
            </td>
        </tr>
        <tr>
            <td>
                <button id="LowSuspension">获取便捷上下车开关</button><span class="result-span" id="LowSuspension_result"></span>
            </td>
            <td>
                <span class="label">便捷上下车</span>
                <button id="set_CarSettingsTpuPlugin_EasyEntryExitEnabled_0">关闭</button>
                <button id="set_CarSettingsTpuPlugin_EasyEntryExitEnabled_1">打开</button>
                <span class="result-span" id="set_CarSettingsTpuPlugin_EasyEntryExitEnabled_result"></span>
            </td>
        </tr>
        <tr>
            <td>
                <button id="TurnRound">获取转向模式</button><span class="result-span" id="TurnRound_result"></span>
            </td>
            <td>
                <span class="label">转向模式</span>
                <button id="set_CarSettingsTpuPlugin_SteeringMode_0">舒适</button>
                <button id="set_CarSettingsTpuPlugin_SteeringMode_1">标准</button>
                <button id="set_CarSettingsTpuPlugin_SteeringMode_2">运动</button>
                <span class="result-span" id="set_CarSettingsTpuPlugin_SteeringMode_result"></span>
            </td>
        </tr>
        <tr>
            <td>
                <button id="EnergyRecovery">获取能量回收</button><span class="result-span" id="EnergyRecovery_result"></span>
            </td>
            <td>
                <span class="label">能量回收</span>
                <button id="set_CarSettingsTpuPlugin_RegenerativeBrakingLevel_0">舒适</button>
                <button id="set_CarSettingsTpuPlugin_RegenerativeBrakingLevel_1">标准</button>
                <button id="set_CarSettingsTpuPlugin_RegenerativeBrakingLevel_2">运动</button>
                <span class="result-span" id="set_CarSettingsTpuPlugin_RegenerativeBrakingLevel_result"></span>
            </td>
        </tr>
        <tr>
            <td>
                <button id="VESS">获取低速警示音</button><span class="result-span" id="VESS_result"></span>
            </td>
            <td>
                <span class="label">低速警示音</span>
                <button id="set_CarSettingsTpuPlugin_LowSpeedWarningEnabled_0">关闭</button>
                <button id="set_CarSettingsTpuPlugin_LowSpeedWarningEnabled_1">打开</button>
                <span class="result-span" id="set_CarSettingsTpuPlugin_LowSpeedWarningEnabled_result"></span>
            </td>
        </tr>
        <!-- 下面是只有获取没有设置的 -->
        <tr>
            <td>
                <button id="VehicleGearShift">获取当前档位</button><span class="result-span" id="VehicleGearShift_result"></span>
            </td>
            <td></td>
        </tr>
        <tr>
            <td>
                <button id="PowerPercent">获取电量百分比</button><span class="result-span" id="PowerPercent_result"></span>
            </td>
            <td></td>
        </tr>
        <tr>
            <td>
                <button id="Altitude">获取海拔高度</button><span class="result-span" id="Altitude_result"></span>
            </td>
            <td></td>
        </tr>
        <tr>
            <td>
                <button id="RangeExtenderTemp">获取增程器温度(水温)</button><span class="result-span" id="RangeExtenderTemp_result"></span>
            </td>
            <td></td>
        </tr>
    </table>
    <script src="../dist/carapi-js-lib.umd.cjs"></script>
    <script>
        const myCarApi = window.carapiJsLib;
        if (!myCarApi) {
            console.log('myCarApi is not defined');
        } else {

            [
                "VehicleGearShift", "PowerPercent", "DriveMode", "DrivingMode", "AirSuspension", "SpringSuspension", "Altitude", "SuspensionAdjustment", "SuspensionHeight", "LowSuspension", "TurnRound", "EnergyRecovery", "VESS", "RangeExtenderTemp"
            ].forEach(param => {
                const btn = document.getElementById(param);
                if (btn) {
                    btn.onclick = function() {
                        myCarApi.get_vehicle_driving_status(param, "card", (value) => {
                            // 处理返回的数据
                            let displayValue = value;
                            if (typeof value === 'object') {
                                displayValue = JSON.stringify(value);
                            }
                            document.getElementById(param + "_result").textContent = displayValue !== undefined ? displayValue : '-';
                        });
                    };
                }
            });
            // 设置按钮事件
            const setMap = [{
                key: 'CarSettingsTpuPlugin_EnergyMode',
                vals: [0, 1, 2]
            }, {
                key: 'CarSettingsTpuPlugin_PowerMode',
                vals: [0, 1, 2, 3, 4, 5]
            }, {
                key: 'CarSettingsTpuPlugin_MagicSuspensionMode',
                vals: [0, 1]
            }, {
                key: 'CarSettingsTpuPlugin_CdcSuspensionMode',
                vals: [0, 1]
            }, {
                key: 'CarSettingsTpuPlugin_SuspensionComfortLevel',
                vals: [0, 1, 2]
            }, {
                key: 'CarSettingsTpuPlugin_SuspensionHeight',
                vals: [0, 1, 2, 3]
            }, {
                key: 'CarSettingsTpuPlugin_EasyEntryExitEnabled',
                vals: [0, 1]
            }, {
                key: 'CarSettingsTpuPlugin_SteeringMode',
                vals: [0, 1, 2]
            }, {
                key: 'CarSettingsTpuPlugin_RegenerativeBrakingLevel',
                vals: [0, 1, 2]
            }, {
                key: 'CarSettingsTpuPlugin_LowSpeedWarningEnabled',
                vals: [0, 1]
            }];
            setMap.forEach(item => {
                item.vals.forEach(val => {
                    const btnId = `set_${item.key}_${val}`;
                    const btn = document.getElementById(btnId);
                    if (btn) {
                        btn.onclick = function() {
                            let res = myCarApi.set_vehicle_driving_control(item.key, val);
                            console.log("set_vehicle_driving_control", item.key, val, res);
                        };
                    }
                });
            });
        }
    </script>
</body>

</html>
