<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行程数据接口</title>
    <link rel="stylesheet" href="common-test-page.css">
</head>

<body>
    <h1>行程数据接口</h1>
    <div id="button-list">
        <div class="button-row"><button id="mileage">获取当前陪伴总里程</button><span class="result-span" id="mileage_result"></span></div>
        <div class="button-row"><button id="mileageCd">获取当前陪伴CD里程</button><span class="result-span" id="mileageCd_result"></span></div>
        <div class="button-row"><button id="mileageCs">获取当前陪伴CS里程</button><span class="result-span" id="mileageCs_result"></span></div>
        <div class="button-row"><button id="drivingDays">获取行驶天数</button><span class="result-span" id="drivingDays_result"></span></div>
        <div class="button-row"><button id="drivingDuration">获取总驾驶时长</button><span class="result-span" id="drivingDuration_result"></span></div>
        <div class="button-row"><button id="drivingDurationCd">获取总cd驾驶时长</button><span class="result-span" id="drivingDurationCd_result"></span></div>
        <div class="button-row"><button id="drivingDurationCs">获取总cs驾驶时长</button><span class="result-span" id="drivingDurationCs_result"></span></div>
    </div>
    <script src="../dist/carapi-js-lib.umd.cjs"></script>
    <script>
        const myCarApi = window.carapiJsLib;
        if (!myCarApi) {
            console.log('myCarApi is not defined');
        } else {

            [
                "mileage", "mileageCd", "mileageCs", "drivingDays", "drivingDuration",
                "drivingDurationCd", "drivingDurationCs"
            ].forEach(param => {
                document.getElementById(param).onclick = function() {
                    myCarApi.get_bind_trip(param, "card", (value) => {
                        // 处理返回的数据
                        let displayValue = value;
                        if (typeof value === 'object') {
                            displayValue = JSON.stringify(value);
                        }
                        document.getElementById(param + "_result").textContent = displayValue !== undefined ? displayValue : '-';
                    });
                };
            });
        }
    </script>
</body>

</html>
