<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>除雾除霜接口</title>
    <link rel="stylesheet" href="common-test-page.css">
</head>

<body>
    <h1>除雾除霜接口</h1>
    <div style="display: flex; gap: 40px; align-items: flex-start;">
        <div id="button-list">
            <div class="button-row"><button id="AcDefrost">获取车内除雾开关状态</button><span class="result-span" id="AcDefrost_result"></span></div>
            <div class="button-row"><button id="AcRearDefrost">获取后窗加热除霜开关状态</button><span class="result-span" id="AcRearDefrost_result"></span></div>
            <div class="button-row"><button id="AcMaxCold">获取急速制冷模式状态</button><span class="result-span" id="AcMaxCold_result"></span></div>
        </div>
        <div id="set-button-list">
            <div class="button-row">
                <span>车内除雾</span>
                <button id="set_CarControlTpuPlugin_AcDefrostState_1">开</button>
                <button id="set_CarControlTpuPlugin_AcDefrostState_0">关</button>
                <span class="result-span" id="set_CarControlTpuPlugin_AcDefrostState_result"></span>
            </div>
            <div class="button-row">
                <span>后窗加热除霜</span>
                <button id="set_CarControlTpuPlugin_AcRearDefrostState_1">开</button>
                <button id="set_CarControlTpuPlugin_AcRearDefrostState_0">关</button>
                <span class="result-span" id="set_CarControlTpuPlugin_AcRearDefrostState_result"></span>
            </div>
            <div class="button-row">
                <span>急速制冷</span>
                <button id="set_CarControlTpuPlugin_AcMaxColdState_1">开</button>
                <button id="set_CarControlTpuPlugin_AcMaxColdState_0">关</button>
                <span class="result-span" id="set_CarControlTpuPlugin_AcMaxColdState_result"></span>
            </div>
        </div>
    </div>
    <script src="../dist/carapi-js-lib.umd.cjs"></script>
    <script>
        const myCarApi = window.carapiJsLib;
        if (!myCarApi) {
            console.log('myCarApi is not defined');
        } else {
            [
                "AcDefrost", "AcRearDefrost", "AcMaxCold"
            ].forEach(param => {
                document.getElementById(param).onclick = function() {
                    myCarApi.get_defrost_defogging_control(param, "card", (value) => {
                        // 处理返回的数据
                        let displayValue = value;
                        if (typeof value === 'object') {
                            displayValue = JSON.stringify(value);
                        }
                        document.getElementById(param + "_result").textContent = displayValue !== undefined ? displayValue : '-';
                    });
                };
            });
            // 设置按钮事件
            const setMap = [{
                key: 'CarControlTpuPlugin_AcDefrostState',
                vals: [1, 0]
            }, {
                key: 'CarControlTpuPlugin_AcRearDefrostState',
                vals: [1, 0]
            }, {
                key: 'CarControlTpuPlugin_AcMaxColdState',
                vals: [1, 0]
            }];
            setMap.forEach(item => {
                item.vals.forEach(val => {
                    const btnId = `set_${item.key}_${val}`;
                    document.getElementById(btnId).onclick = function() {
                        let result = myCarApi.set_defrost_defogging_control(item.key, val);
                        console.log("btnId: ", btnId, "result: ", result);
                    };
                });
            });
        }
    </script>
</body>

</html>
