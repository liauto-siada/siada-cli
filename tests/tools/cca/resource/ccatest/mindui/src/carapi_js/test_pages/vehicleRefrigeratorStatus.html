<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车辆冰箱状态接口</title>
    <link rel="stylesheet" href="common-test-page.css">
</head>

<body>
    <h1>车辆冰箱状态接口</h1>
    <div style="display: flex; gap: 40px; align-items: flex-start;">
        <div id="button-list">
            <div class="button-row"><button id="Door">获取冰箱门开关</button><span class="result-span" id="Door_result"></span></div>
            <div class="button-row"><button id="CoolTmp">获取冰箱冷藏温度</button><span class="result-span" id="CoolTmp_result"></span></div>
            <div class="button-row"><button id="HotTmp">获取冰箱制热温度</button><span class="result-span" id="HotTmp_result"></span></div>
            <div class="button-row"><button id="WorkMode">获取冰箱模式</button><span class="result-span" id="WorkMode_result"></span></div>
        </div>
        <div id="set-button-list">
            <div class="button-row">
                <span>冰箱门</span>
                <button id="set_CarExtDeviceTpuPlugin_FridgeDoorState_1">开</button>
                <button id="set_CarExtDeviceTpuPlugin_FridgeDoorState_0">关</button>
                <span class="result-span" id="set_CarExtDeviceTpuPlugin_FridgeDoorState_result"></span>
            </div>
            <div class="button-row">
                <span>冷藏温度</span>
                <input id="input_FridgeCoolTmp" type="number" min="0" max="7" style="width:60px;" />
                <button id="btn_set_FridgeCoolTmp">设置</button>
                <span class="result-span" id="set_FridgeCoolTmp_result"></span>
            </div>
            <div class="button-row">
                <span>制热温度</span>
                <input id="input_FridgeHotTmp" type="number" min="35" max="50" style="width:60px;" />
                <button id="btn_set_FridgeHotTmp">设置</button>
                <span class="result-span" id="set_FridgeHotTmp_result"></span>
            </div>
            <div class="button-row">
                <span>冰箱模式</span>
                <button id="set_CarExtDeviceTpuPlugin_FridgeWorkMode_0">关</button>
                <button id="set_CarExtDeviceTpuPlugin_FridgeWorkMode_1">制冷</button>
                <button id="set_CarExtDeviceTpuPlugin_FridgeWorkMode_2">制热</button>
                <span class="result-span" id="set_CarExtDeviceTpuPlugin_FridgeWorkMode_result"></span>
            </div>
        </div>
    </div>
    <script src="../dist/carapi-js-lib.umd.cjs"></script>
    <script>
        const myCarApi = window.carapiJsLib;
        if (!myCarApi) {
            console.log('myCarApi is not defined');
        } else {

            [
                "Door", "CoolTmp", "HotTmp", "WorkMode"
            ].forEach(param => {
                document.getElementById(param).onclick = function() {
                    myCarApi.get_vehicle_refrigerator_status(param, "card", (value) => {
                        // 处理返回的数据
                        let displayValue = value;
                        if (typeof value === 'object') {
                            displayValue = JSON.stringify(value);
                        }
                        document.getElementById(param + "_result").textContent = displayValue !== undefined ? displayValue : '-';
                    });
                };
            });
            // 设置按钮事件
            // 冰箱门
            [1, 0].forEach(val => {
                document.getElementById(`set_CarExtDeviceTpuPlugin_FridgeDoorState_${val}`).onclick = function() {
                    let res = myCarApi.set_vehicle_refrigerator_control('CarExtDeviceTpuPlugin_FridgeDoorState', val);
                    console.log("set_vehicle_refrigerator_control", 'CarExtDeviceTpuPlugin_FridgeDoorState', val, res);
                };
            });
            // 冷藏温度输入框
            document.getElementById('btn_set_FridgeCoolTmp').onclick = function() {
                const val = parseInt(document.getElementById('input_FridgeCoolTmp').value, 10);
                if (isNaN(val) || val < 0 || val > 7) {
                    document.getElementById('set_FridgeCoolTmp_result').textContent = '请输入0~7';
                    return;
                }
                let res = myCarApi.set_vehicle_refrigerator_control('CarExtDeviceTpuPlugin_FridgeTemp', val);
                console.log("set_vehicle_refrigerator_control", 'CarExtDeviceTpuPlugin_FridgeTemp', val, res);
                document.getElementById('set_FridgeCoolTmp_result').textContent = '已发送设置:' + val;
            };
            // 制热温度输入框
            document.getElementById('btn_set_FridgeHotTmp').onclick = function() {
                const val = parseInt(document.getElementById('input_FridgeHotTmp').value, 10);
                if (isNaN(val) || val < 35 || val > 50) {
                    document.getElementById('set_FridgeHotTmp_result').textContent = '请输入35~50';
                    return;
                }
                let res = myCarApi.set_vehicle_refrigerator_control('CarExtDeviceTpuPlugin_FridgeTemp', val);
                console.log("set_vehicle_refrigerator_control", 'CarExtDeviceTpuPlugin_FridgeTemp', val, res);
                document.getElementById('set_FridgeHotTmp_result').textContent = '已发送设置:' + val;
            };
            // 冰箱模式
            [0, 1, 2].forEach(val => {
                document.getElementById(`set_CarExtDeviceTpuPlugin_FridgeWorkMode_${val}`).onclick = function() {
                    let res = myCarApi.set_vehicle_refrigerator_control('CarExtDeviceTpuPlugin_FridgeWorkMode', val);
                    console.log("set_vehicle_refrigerator_control", 'CarExtDeviceTpuPlugin_FridgeWorkMode', val, res);
                };
            });
        }
    </script>
</body>

</html>
