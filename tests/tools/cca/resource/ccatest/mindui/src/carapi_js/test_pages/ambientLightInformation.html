<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>氛围灯信息接口</title>
    <link rel="stylesheet" href="common-test-page.css">
</head>

<body>
    <h1>氛围灯信息接口</h1>
    <div id="button-list">
        <div class="button-row"><button id="AmbientLightSwitch">获取氛围灯开启状态</button><span class="result-span" id="AmbientLightSwitch_result"></span></div>
        <div class="button-row"><button id="AmbientLightBrightness">获取氛围灯亮度</button><span class="result-span" id="AmbientLightBrightness_result"></span></div>
    </div>
    <script src="../dist/carapi-js-lib.umd.cjs"></script>
    <script>
        const myCarApi = window.carapiJsLib;
        if (!myCarApi) {
            console.log('myCarApi is not defined');
        } else {

            [
                "AmbientLightSwitch", "AmbientLightBrightness"
            ].forEach(param => {
                document.getElementById(param).onclick = function() {
                    myCarApi.get_ambient_light_information(param, "card", (value) => {
                        // 处理返回的数据
                        let displayValue = value;
                        if (typeof value === 'object') {
                            displayValue = JSON.stringify(value);
                        }
                        document.getElementById(param + "_result").textContent = displayValue !== undefined ? displayValue : '-';
                    });
                };
            });
        }
    </script>
</body>

</html>
