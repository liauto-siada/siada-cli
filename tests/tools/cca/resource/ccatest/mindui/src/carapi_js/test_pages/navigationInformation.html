<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航信息接口</title>
    <link rel="stylesheet" href="common-test-page.css">
</head>

<body>
    <h1>导航信息接口</h1>
    <div style="display: flex; gap: 40px; align-items: flex-start;">
        <div id="button-list">
            <div class="button-row"><button id="DestinationPoiName">获取导航目的地名称</button><span class="result-span" id="DestinationPoiName_result"></span></div>
            <div class="button-row"><button id="RemainTime">获取导航剩余时间</button><span class="result-span" id="RemainTime_result"></span></div>
        </div>
    </div>
    <script src="../dist/carapi-js-lib.umd.cjs"></script>
    <script>
        const myCarApi = window.carapiJsLib;
        if (!myCarApi) {
            console.log('myCarApi is not defined');
        } else {
            [
                "DestinationPoiName", "RemainTime"
            ].forEach(param => {
                document.getElementById(param).onclick = function() {
                    myCarApi.get_navigation_information(param, "card", (value) => {
                        // 处理返回的数据
                        let displayValue = value;
                        if (typeof value === 'object') {
                            displayValue = JSON.stringify(value);
                        }
                        document.getElementById(param + "_result").textContent = displayValue !== undefined ? displayValue : '-';
                    });
                };
            });
        }
    </script>
</body>

</html>
