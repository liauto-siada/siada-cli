<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方向盘加热接口</title>
    <link rel="stylesheet" href="common-test-page.css">
</head>

<body>
    <h1>方向盘加热接口</h1>
    <div style="display: flex; gap: 40px; align-items: flex-start;">
        <div id="button-list">
            <div class="button-row"><button id="AcSteeringWheelHeat">获取方向盘加热开关状态</button><span class="result-span" id="AcSteeringWheelHeat_result"></span></div>
            <div class="button-row"><button id="AcStrWhlSeatAutoHeat">获取方向盘加热自动调节状态</button><span class="result-span" id="AcStrWhlSeatAutoHeat_result"></span></div>
        </div>
        <div id="set-button-list">
            <div class="button-row">
                <span>方向盘加热</span>
                <button id="set_CarControlTpuPlugin_AcSteeringWheelHeatState_1">开</button>
                <button id="set_CarControlTpuPlugin_AcSteeringWheelHeatState_0">关</button>
                <span class="result-span" id="set_CarControlTpuPlugin_AcSteeringWheelHeatState_result"></span>
            </div>
            <div class="button-row">
                <span>自动调节</span>
                <button id="set_CarControlTpuPlugin_AcStrWhlSeatAutoHeatState_1">开</button>
                <button id="set_CarControlTpuPlugin_AcStrWhlSeatAutoHeatState_0">关</button>
                <span class="result-span" id="set_CarControlTpuPlugin_AcStrWhlSeatAutoHeatState_result"></span>
            </div>
        </div>
    </div>
    <script src="../dist/carapi-js-lib.umd.cjs"></script>
    <script>
        const myCarApi = window.carapiJsLib;
        if (!myCarApi) {
            console.log('myCarApi is not defined');
        } else {
            [
                "AcSteeringWheelHeat", "AcStrWhlSeatAutoHeat"
            ].forEach(param => {
                document.getElementById(param).onclick = function() {
                    myCarApi.get_steering_wheel_seat_heating(param, "card", (value) => {
                        // 处理返回的数据
                        let displayValue = value;
                        if (typeof value === 'object') {
                            displayValue = JSON.stringify(value);
                        }
                        document.getElementById(param + "_result").textContent = displayValue !== undefined ? displayValue : '-';
                    });
                };
            });
            // 设置按钮事件
            [{
                key: 'CarControlTpuPlugin_AcSteeringWheelHeatState',
                vals: [1, 0]
            }, {
                key: 'CarControlTpuPlugin_AcStrWhlSeatAutoHeatState',
                vals: [1, 0]
            }].forEach(item => {
                item.vals.forEach(val => {
                    const btnId = `set_${item.key}_${val}`;
                    document.getElementById(btnId).onclick = function() {
                        let result = myCarApi.set_steering_wheel_seat_heating(item.key, val);
                        console.log("btnId: ", btnId, "result: ", result);
                    };
                });
            });
        }
    </script>
</body>

</html>
