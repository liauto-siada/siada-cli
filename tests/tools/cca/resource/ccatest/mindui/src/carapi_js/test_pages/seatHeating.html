<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>座椅加热接口</title>
    <link rel="stylesheet" href="common-test-page.css">
</head>

<body>
    <h1>座椅加热接口</h1>
    <div style="display: flex; gap: 40px; align-items: flex-start;">
        <div id="button-list">
            <div class="button-row"><button id="SeatAcRow1LeftHeat">获取主驾座椅加热档位</button><span class="result-span" id="SeatAcRow1LeftHeat_result"></span></div>
            <div class="button-row"><button id="SeatAcRow1RightHeat">获取副驾座椅加热档位</button><span class="result-span" id="SeatAcRow1RightHeat_result"></span></div>
            <div class="button-row"><button id="SeatAcRow2LeftHeat">获取二排左座椅加热档位</button><span class="result-span" id="SeatAcRow2LeftHeat_result"></span></div>
            <div class="button-row"><button id="SeatAcRow2RightHeat">获取二排右座椅加热档位</button><span class="result-span" id="SeatAcRow2RightHeat_result"></span></div>
            <div class="button-row"><button id="SeatAcRow2MiddleHeat">获取二排中间座椅加热档位</button><span class="result-span" id="SeatAcRow2MiddleHeat_result"></span></div>
            <div class="button-row"><button id="SeatAcRow3LeftHeat">获取三排左座椅加热档位</button><span class="result-span" id="SeatAcRow3LeftHeat_result"></span></div>
            <div class="button-row"><button id="SeatAcRow3RightHeat">获取三排右座椅加热档位</button><span class="result-span" id="SeatAcRow3RightHeat_result"></span></div>
            <div class="button-row"><button id="SeatAcRow3MiddleHeat">获取三排中间座椅加热档位</button><span class="result-span" id="SeatAcRow3MiddleHeat_result"></span></div>
        </div>
        <div id="set-button-list">
            <div class="button-row">
                <span>主驾座椅</span>
                <button id="set_CarControlTpuPlugin_SeatAcRow1LeftHeat_0">关</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow1LeftHeat_1">一档</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow1LeftHeat_2">二档</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow1LeftHeat_3">三档</button>
                <span class="result-span" id="set_CarControlTpuPlugin_SeatAcRow1LeftHeat_result"></span>
            </div>
            <div class="button-row">
                <span>副驾座椅</span>
                <button id="set_CarControlTpuPlugin_SeatAcRow1RightHeat_0">关</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow1RightHeat_1">一档</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow1RightHeat_2">二档</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow1RightHeat_3">三档</button>
                <span class="result-span" id="set_CarControlTpuPlugin_SeatAcRow1RightHeat_result"></span>
            </div>
            <div class="button-row">
                <span>二排左座椅</span>
                <button id="set_CarControlTpuPlugin_SeatAcRow2LeftHeat_0">关</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow2LeftHeat_1">一档</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow2LeftHeat_2">二档</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow2LeftHeat_3">三档</button>
                <span class="result-span" id="set_CarControlTpuPlugin_SeatAcRow2LeftHeat_result"></span>
            </div>
            <div class="button-row">
                <span>二排右座椅</span>
                <button id="set_CarControlTpuPlugin_SeatAcRow2RightHeat_0">关</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow2RightHeat_1">一档</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow2RightHeat_2">二档</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow2RightHeat_3">三档</button>
                <span class="result-span" id="set_CarControlTpuPlugin_SeatAcRow2RightHeat_result"></span>
            </div>
            <div class="button-row">
                <span>二排中间座椅</span>
                <button id="set_CarControlTpuPlugin_SeatAcRow2MiddleHeat_0">关</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow2MiddleHeat_1">一档</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow2MiddleHeat_2">二档</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow2MiddleHeat_3">三档</button>
                <span class="result-span" id="set_CarControlTpuPlugin_SeatAcRow2MiddleHeat_result"></span>
            </div>
            <div class="button-row">
                <span>三排左座椅</span>
                <button id="set_CarControlTpuPlugin_SeatAcRow3LeftHeat_0">关</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow3LeftHeat_1">一档</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow3LeftHeat_2">二档</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow3LeftHeat_3">三档</button>
                <span class="result-span" id="set_CarControlTpuPlugin_SeatAcRow3LeftHeat_result"></span>
            </div>
            <div class="button-row">
                <span>三排右座椅</span>
                <button id="set_CarControlTpuPlugin_SeatAcRow3RightHeat_0">关</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow3RightHeat_1">一档</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow3RightHeat_2">二档</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow3RightHeat_3">三档</button>
                <span class="result-span" id="set_CarControlTpuPlugin_SeatAcRow3RightHeat_result"></span>
            </div>
            <div class="button-row">
                <span>三排中间座椅</span>
                <button id="set_CarControlTpuPlugin_SeatAcRow3MiddleHeat_0">关</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow3MiddleHeat_1">一档</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow3MiddleHeat_2">二档</button>
                <button id="set_CarControlTpuPlugin_SeatAcRow3MiddleHeat_3">三档</button>
                <span class="result-span" id="set_CarControlTpuPlugin_SeatAcRow3MiddleHeat_result"></span>
            </div>
        </div>
    </div>
    <script src="../dist/carapi-js-lib.umd.cjs"></script>
    <script>
        const myCarApi = window.carapiJsLib;
        if (!myCarApi) {
            console.log('myCarApi is not defined');
        } else {

            [
                "SeatAcRow1LeftHeat", "SeatAcRow1RightHeat", "SeatAcRow2LeftHeat", "SeatAcRow2RightHeat", "SeatAcRow2MiddleHeat", "SeatAcRow3LeftHeat", "SeatAcRow3RightHeat", "SeatAcRow3MiddleHeat"
            ].forEach(param => {
                document.getElementById(param).onclick = function() {
                    myCarApi.get_rear_seat_heating(param, "card", (value) => {
                        // 处理返回的数据
                        let displayValue = value;
                        if (typeof value === 'object') {
                            displayValue = JSON.stringify(value);
                        }
                        document.getElementById(param + "_result").textContent = displayValue !== undefined ? displayValue : '-';
                    });
                };
            });
            // 设置按钮事件
            const setMap = [{
                key: 'CarControlTpuPlugin_SeatAcRow1LeftHeat',
                label: '主驾座椅'
            }, {
                key: 'CarControlTpuPlugin_SeatAcRow1RightHeat',
                label: '副驾座椅'
            }, {
                key: 'CarControlTpuPlugin_SeatAcRow2LeftHeat',
                label: '二排左座椅'
            }, {
                key: 'CarControlTpuPlugin_SeatAcRow2RightHeat',
                label: '二排右座椅'
            }, {
                key: 'CarControlTpuPlugin_SeatAcRow2MiddleHeat',
                label: '二排中间座椅'
            }, {
                key: 'CarControlTpuPlugin_SeatAcRow3LeftHeat',
                label: '三排左座椅'
            }, {
                key: 'CarControlTpuPlugin_SeatAcRow3RightHeat',
                label: '三排右座椅'
            }, {
                key: 'CarControlTpuPlugin_SeatAcRow3MiddleHeat',
                label: '三排中间座椅'
            }];
            setMap.forEach(item => {
                [0, 1, 2, 3].forEach(val => {
                    const btnId = `set_${item.key}_${val}`;
                    document.getElementById(btnId).onclick = function() {
                        let res = myCarApi.set_seat_heating(item.key, val);
                        console.log("set_seat_heating", item.key, val, res);
                    };
                });
            });
        }
    </script>
</body>

</html>
