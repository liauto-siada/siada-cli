<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>充电信息接口</title>
    <link rel="stylesheet" href="common-test-page.css">
</head>

<body>
    <h1>充电信息接口</h1>
    <div id="button-list">
        <div class="button-row"><button id="ChargeStatus">获取充电状态</button><span class="result-span" id="ChargeStatus_result"></span></div>
        <div class="button-row"><button id="ChargingStartTime">获取充电开始时间</button><span class="result-span" id="ChargingStartTime_result"></span></div>
        <div class="button-row"><button id="MSG_RESSInterVolt">获取动力电池内部电压</button><span class="result-span" id="MSG_RESSInterVolt_result"></span></div>
        <div class="button-row"><button id="DischargeStatus">获取动力电池内部电流</button><span class="result-span" id="DischargeStatus_result"></span></div>
        <div class="button-row"><button id="ChargeRemainTime">获取剩余充电时长</button><span class="result-span" id="ChargeRemainTime_result"></span></div>
        <div class="button-row"><button id="ChargeLimit">获取充电上限设置</button><span class="result-span" id="ChargeLimit_result"></span></div>
        <div class="button-row"><button id="ReserveSwitchStatus">获取预约充电开关</button><span class="result-span" id="ReserveSwitchStatus_result"></span></div>
        <div class="button-row"><button id="ChargeType">获取充电类型</button><span class="result-span" id="ChargeType_result"></span></div>
        <div class="button-row"><button id="OGCChargeVoltage">获取直流电压</button><span class="result-span" id="OGCChargeVoltage_result"></span></div>
        <div class="button-row"><button id="OGCChargeCurrent">获取直流电流</button><span class="result-span" id="OGCChargeCurrent_result"></span></div>
        <div class="button-row"><button id="ACChargeVoltage">获取交流电压</button><span class="result-span" id="ACChargeVoltage_result"></span></div>
        <div class="button-row"><button id="ACChargeCurrent">获取交流电流</button><span class="result-span" id="ACChargeCurrent_result"></span></div>
        <div class="button-row"><button id="WarmSwitchStatus">获取电池保温</button><span class="result-span" id="WarmSwitchStatus_result"></span></div>
        <div class="button-row"><button id="TempControl">获取自动充电预冷/预热状态</button><span class="result-span" id="TempControl_result"></span></div>
        <div class="button-row"><button id="ManuTempAdjStatus">获取立即预冷/预热状态</button><span class="result-span" id="ManuTempAdjStatus_result"></span></div>
    </div>
    <script src="../dist/carapi-js-lib.umd.cjs"></script>
    <script>
        const myCarApi = window.carapiJsLib;
        if (!myCarApi) {
            console.log('myCarApi is not defined');
        } else {

            [
                "ChargeStatus", "ChargingStartTime", "MSG_RESSInterVolt", "DischargeStatus", "ChargeRemainTime",
                "ChargeLimit", "ReserveSwitchStatus", "ChargeType", "OGCChargeVoltage", "OGCChargeCurrent",
                "ACChargeVoltage", "ACChargeCurrent", "WarmSwitchStatus", "TempControl", "ManuTempAdjStatus"
            ].forEach(param => {
                document.getElementById(param).onclick = function() {
                    myCarApi.get_charging_information(param, "card", (value) => {
                        // 处理返回的数据
                        let displayValue = value;
                        if (typeof value === 'object') {
                            displayValue = JSON.stringify(value);
                        }
                        document.getElementById(param + "_result").textContent = displayValue !== undefined ? displayValue : '-';
                    });
                };
            });
        }
    </script>
</body>

</html>
