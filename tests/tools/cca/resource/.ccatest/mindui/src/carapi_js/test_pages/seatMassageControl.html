<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>座椅按摩控制接口</title>
    <link rel="stylesheet" href="common-test-page.css">
</head>

<body>
    <h1>座椅按摩控制接口</h1>
    <div style="display: flex; gap: 40px; align-items: flex-start;">
        <div id="button-list">
            <div class="button-row"><button id="Switch_FL">获取主驾座椅按摩开关状态</button><span class="result-span" id="Switch_FL_result"></span></div>
            <div class="button-row"><button id="Switch_FR">获取副驾座椅按摩开关状态</button><span class="result-span" id="Switch_FR_result"></span></div>
            <div class="button-row"><button id="Switch_SecL">获取二排左座椅按摩开关状态</button><span class="result-span" id="Switch_SecL_result"></span></div>
            <div class="button-row"><button id="Switch_SecR">获取二排右座椅按摩开关状态</button><span class="result-span" id="Switch_SecR_result"></span></div>
        </div>
        <div id="set-button-list">
            <div class="button-row">
                <span>主驾座椅</span>
                <button id="set_CarControlTpuPlugin_SeatMassageRow1LeftSw_1">开</button>
                <button id="set_CarControlTpuPlugin_SeatMassageRow1LeftSw_0">关</button>
                <span class="result-span" id="set_CarControlTpuPlugin_SeatMassageRow1LeftSw_result"></span>
            </div>
            <div class="button-row">
                <span>副驾座椅</span>
                <button id="set_CarControlTpuPlugin_SeatMassageRow1RightSw_1">开</button>
                <button id="set_CarControlTpuPlugin_SeatMassageRow1RightSw_0">关</button>
                <span class="result-span" id="set_CarControlTpuPlugin_SeatMassageRow1RightSw_result"></span>
            </div>
            <div class="button-row">
                <span>二排左座椅</span>
                <button id="set_CarControlTpuPlugin_SeatMassageRow2LeftSw_1">开</button>
                <button id="set_CarControlTpuPlugin_SeatMassageRow2LeftSw_0">关</button>
                <span class="result-span" id="set_CarControlTpuPlugin_SeatMassageRow2LeftSw_result"></span>
            </div>
            <div class="button-row">
                <span>二排右座椅</span>
                <button id="set_CarControlTpuPlugin_SeatMassageRow2RightSw_1">开</button>
                <button id="set_CarControlTpuPlugin_SeatMassageRow2RightSw_0">关</button>
                <span class="result-span" id="set_CarControlTpuPlugin_SeatMassageRow2RightSw_result"></span>
            </div>
        </div>
    </div>
    <script src="../dist/carapi-js-lib.umd.cjs"></script>
    <script>
        const myCarApi = window.carapiJsLib;
        if (!myCarApi) {
            console.log('myCarApi is not defined');
        } else {

            [
                "Switch_FL", "Switch_FR", "Switch_SecL", "Switch_SecR"
            ].forEach(param => {
                document.getElementById(param).onclick = function() {
                    myCarApi.get_seat_massage_control(param, "card", (value) => {
                        // 处理返回的数据
                        let displayValue = value;
                        if (typeof value === 'object') {
                            displayValue = JSON.stringify(value);
                        }
                        document.getElementById(param + "_result").textContent = displayValue !== undefined ? displayValue : '-';
                    });
                };
            });
            // 设置按钮事件
            const setMap = [{
                key: 'CarControlTpuPlugin_SeatMassageRow1LeftSw',
                label: '主驾座椅'
            }, {
                key: 'CarControlTpuPlugin_SeatMassageRow1RightSw',
                label: '副驾座椅'
            }, {
                key: 'CarControlTpuPlugin_SeatMassageRow2LeftSw',
                label: '二排左座椅'
            }, {
                key: 'CarControlTpuPlugin_SeatMassageRow2RightSw',
                label: '二排右座椅'
            }];
            setMap.forEach(item => {
                [1, 0].forEach(val => {
                    const btnId = `set_${item.key}_${val}`;
                    document.getElementById(btnId).onclick = function() {
                        let res = myCarApi.set_seat_massage_control(item.key, val);
                        console.log("set_seat_massage_control", item.key, val, res);
                    };
                });
            });
        }
    </script>
</body>

</html>
