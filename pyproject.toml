[tool.poetry]
name = "siada-cli"
version = "0.0.1"
description = "Siada CLI is a Ai Pair Programming Tool in terminal"
packages = [{include = "siada"}, {include = "agent_config.yaml"}]
include = ["agent_config.yaml"]

[tool.poetry.scripts]
siada-cli = "siada.entrypoint.siadahub:main"
[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = "^0.27.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
openai-agents = "0.2.5"
openai = "^1.99.9"
litellm = "^1.72.6"
openhands-aci = "0.3.0"
termcolor = "^3.1.0"
psutil = "^7.0.0"
pexpect = "^4.9.0"
binaryornot = "0.4.4"
diskcache = "5.6.3"
rich = "^13.0.0"
tqdm = "^4.67.1"
pygments = "^2.19.1"
grep-ast = "^0.9.0"
click = "^8.2.1"
configargparse = "^1.7"
shtab = "^1.7"
patch-ng = "^1.18.1"
trafilatura = "^2.0.0"
prompt-toolkit = "^3.0.51"
partial-json-parser = "^0.2.1.1.post6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.27.0"
pytest-asyncio = "^1.1.0"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
