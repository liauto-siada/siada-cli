[tool.poetry]
name = "siada-agenthub"
version = "0.1.0"
description = "提供Siada agent对外的RPC能力"
authors = ["Your Name <your.email@example.com>"]
packages = [{include = "siada"}, {include = "agent_config.yaml"}]
include = ["agent_config.yaml"]

[tool.poetry.scripts]
siadahub = "siada.entrypoint.cli:siadahub"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = "^0.27.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
openai-agents = "^0.0.17"
openai = "^1.66.5"
litellm={extras = ["all"], version = "^1.72.6"}
openhands-aci = "0.3.0"
termcolor = "^3.1.0"
psutil = "^7.0.0"
pexpect = "^4.9.0"
binaryornot = "0.4.4"
diskcache = "5.6.3"
rich = "^13.0.0"
networkx = "^3.5"
tqdm = "^4.67.1"
pygments = "^2.19.1"
grep-ast = "^0.9.0"
scipy = "^1.15.3"
click = "^8.2.1"
patch-ng = "^1.18.1"
datasets = "^3.6.0"
trafilatura = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
