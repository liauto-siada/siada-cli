[tool.poetry]
name = "siada-cli"
version = "1.7.32b1"
description = "Siada CLI is a Ai Pair Programming Tool in terminal"
packages = [
    {include = "siada"},
    {include = "siada_cli_ui", format = "sdist"},
    {include = "siada_cli_ui/__init__.py", format = "wheel"},
]
include = [
    {path = "agent_config.yaml", format = ["sdist", "wheel"]},
    "siada/resources/**/*",             # Include built-in skills and resource files
    {path = "siada/agent_hub/coder/prompt/models/gpt6/templates/**/*.md", format = ["sdist", "wheel"]},
    {path = "siada/agent_hub/coder/prompt/models/gpt6/templates/*.toml", format = ["sdist", "wheel"]},
    {path = "siada/agent_hub/coder/prompt/models/kimi_k3/templates/*.md", format = ["sdist", "wheel"]},
    {path = "siada/agent_hub/coder/prompt/models/glm/templates/*.md", format = ["sdist", "wheel"]},
    {path = "siada_cli_ui/bundle/siada-ui.js", format = ["sdist", "wheel"]},
    {path = "siada_cli_ui/bundle/*.LEGAL.txt", format = ["sdist", "wheel"]},
    {path = "siada_cli_ui/package.json", format = ["sdist", "wheel"]},
    {path = "docs/CREDITS.md", format = ["sdist", "wheel"]},
    {path = "docs/zh-CN/CREDITS_zh.md", format = ["sdist", "wheel"]},
    {path = "chrome-acp/LICENSE", format = ["sdist", "wheel"]},
    {path = "chrome-acp/THIRD_PARTY_NOTICES.md", format = ["sdist", "wheel"]},
    {path = "NOTICE", format = ["sdist", "wheel"]},
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "siada_cli_ui/node_modules",
    "siada_cli_ui/dist",
    "siada_cli_ui/examples",
    "siada_cli_ui/**/*.map",
    "siada_cli_ui/bundle/esbuild-meta.json",
]
license = "Apache-2.0"
readme = "README.md"

classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python",
    "Topic :: Software Development",
]

[tool.poetry.scripts]
siada-cli = "siada.entrypoint.launch_ui_with_acp:main"
siada-acp = "siada.acp_server.main:main"
siada-browser = "siada.browser_addon.cli:main"
[tool.poetry.dependencies]
# litellm requires Python <3.14, so cap the supported range accordingly.
python = ">=3.12,<3.14"
fastapi = ">=0.110.0,<1.0.0"
uvicorn = ">=0.27.0,<1.0.0"
# Align with openai-agents-python reference project versions.
# Pins track the v0.22.3 release's uv.lock: openai-agents 0.22.3 requires
# openai>=3.0.0,<4, and its lock pins openai 3.0.0 / litellm 1.83.0 (the
# litellm extra requires >=1.83.0). The pydantic floor also satisfies the
# SDK's >=2.12.2 requirement.
pydantic = ">=2.12.5,<3.0.0"
pydantic-settings = ">=2.2.0,<3.0.0"
openai-agents = "0.22.3"
openai = "3.0.0"
litellm = "1.83.0"
openhands-aci = "0.3.3"
termcolor = ">=3.1.0,<4.0.0"
psutil = ">=7.0.0,<8.0.0"
pexpect = ">=4.9.0,<5.0.0"
diskcache = "5.6.3"
rich = ">=13.0.0,<=14.1.0"
tqdm = ">=4.67.1,<5.0.0"
pygments = ">=2.19.1,<3.0.0"
grep-ast = ">=0.9.0,<1.0.0"
click = ">=8.2.1,<9.0.0"
configargparse = ">=1.7,<2.0.0"
shtab = ">=1.7,<2.0.0"
patch-ng = ">=1.18.1,<2.0.0"
trafilatura = ">=2.0.0,<3.0.0"
prompt-toolkit = ">=3.0.51,<4.0.0"
partial-json-parser = ">=0.2.1.1.post6,<1.0.0"
networkx = ">=3.5.0,<4.0.0"
# NetworkX's PageRank implementation imports SciPy at runtime.
scipy = ">=1.11.2,<2.0.0"
playwright = ">=1.40.0,<2.0.0"
gitpython = ">=3.1.0,<4.0.0"
pathspec = ">=0.12.0,<1.0.0"
mcp = "1.26.0"
aiohttp = ">=3.8.0,<4.0.0"
drawille = ">=0.1.0,<1.0.0"
concurrent-log-handler = ">=0.9.25,<1.0.0"
toml = "^0.10.2"
requests = "^2.31.0"
jieba = ">=0.42.0,<1.0.0"
apscheduler = ">=3.10.0,<4.0.0"
ruamel-yaml = ">=0.18.0,<1.0.0"
agent-client-protocol = "0.11.0"
httpx = {version = ">=0.27.0,<1.0.0", extras = ["socks"]}
lark-oapi = "^1.6.7"
# macOS-only: required by siada_cli_ui/src/utils/clipboard.ts to read PNG/JPEG/TIFF
# image data from NSPasteboard so users can paste screenshots with Cmd+V.
# Without this, Cmd+V image paste silently does nothing on macOS because the
# subprocess `python -c "from AppKit import NSPasteboard"` fails to import.
pyobjc-framework-Cocoa = {version = ">=10.0", markers = "sys_platform == 'darwin'"}

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<9.0.0"
httpx = ">=0.27.0,<1.0.0"
pytest-asyncio = ">=1.1.0,<2.0.0"


[[tool.poetry.source]]
# Aliyun PyPI mirror (more stable for China network).
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "supplemental"

[[tool.poetry.source]]
name = "pypi"
priority = "primary"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
