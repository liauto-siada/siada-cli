# Agent Configuration File
# Defines the mapping from agent names to Agent classes

agents:
  # Code Development Agent: general-purpose agent for all development tasks
  # (the former bugfix / fegen / bugreproduce / test / deepresearch / browser /
  # card specialized agents were removed; their tasks are handled by CodeGenAgent)
  coder:
    class: "siada.agent_hub.coder.code_gen_agent.CodeGenAgent"
    description: "General-purpose code development agent"
    enabled: true
    supported_modes: "all"

  # Proactive Agent - for background task discovery and daily summaries
  proactive:
    class: "siada.agent_hub.proactive.proactive_agent.ProactiveAgent"
    description: "Proactive agent for task discovery and daily summaries"
    enabled: true
    supported_modes: "all"


# LLM Configuration
llm_config:
  provider: "default"                 # Optional: "default" (bring your own API key) or "openrouter"
  model_name: "claude-sonnet-5"
  repo_map_tokens: 8192                     # repo map max token
  repo_map_mul_no_files: 16                 # Multiple without chat files
  repo_verbose: true                        # Enable detailed output or not

# Configuration Options:
# - class: Full import path of the Agent class, null means not implemented yet
# - description: Description of the agent
# - enabled: Whether the agent is enabled, false means temporarily disabled
