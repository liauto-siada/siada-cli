# Agent配置文件
# 定义agent名称到Agent类的映射关系

agents:
  # Bug修复Agent
  bugfix:
    class: "siada.agent_hub.coder.bug_fix_agent.BugFixAgent"
    description: "专门用于代码bug修复的Agent"
    enabled: true
  
  # 代码开发Agent (暂未实现)
  coder:
    class: null
    description: "通用代码开发Agent"
    enabled: false

# 配置说明:
# - class: Agent类的完整导入路径，如果为null表示暂未实现
# - description: Agent的描述信息
# - enabled: 是否启用该Agent，false表示暂时禁用
